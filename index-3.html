<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Table</title>
<style>
:root{--bg:#1f2a24;--panel:#2a372f;--ink:#f1ead8;--mute:#a9b5a6;--light:#e8dcc0;--dark:#6f8f6a;--hi:#d9b44a;--last:rgba(217,180,74,.45);--wp:#fffaf0;--bp:#141a16;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe7d3;--panel:#e2d6ba;--ink:#1d2a22;--mute:#58655a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{min-height:100%;padding:14px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:1.5rem;margin:6px 0 0;letter-spacing:.02em}
.bar{width:min(94vw,460px);display:flex;justify-content:space-between;align-items:center;font-size:1rem}
.name{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--mute)}
.name input{background:transparent;border:0;border-bottom:1px dashed var(--mute);color:var(--ink);font:inherit;width:9ch;padding:2px}
#status{min-height:1.4em;color:var(--hi);font-style:italic}
#board{width:min(94vw,460px);aspect-ratio:1;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border:4px solid var(--panel);border-radius:4px;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:min(9.6vw,44px);line-height:1;user-select:none;cursor:pointer}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last{box-shadow:inset 0 0 0 100px var(--last)}
.sq.sel{box-shadow:inset 0 0 0 3px var(--hi)}
.sq.mv::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(20,26,22,.35)}
.sq.cap::after{width:88%;height:88%;background:none;border:3px solid rgba(20,26,22,.4)}
.w{color:var(--wp);text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}
.b{color:var(--bp);text-shadow:0 0 1px rgba(255,255,255,.5)}
.ctl{width:min(94vw,460px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button,select{background:var(--panel);color:var(--ink);border:1px solid var(--mute);border-radius:6px;padding:9px 13px;font:inherit;font-size:.95rem}
button:focus-visible,select:focus-visible,.sq:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
#hist{width:min(94vw,460px);color:var(--mute);font-size:.9rem;max-height:4.6em;overflow:auto;text-align:center}
</style>
</head>
<body>
<h1>Chess Table</h1>
<div class="bar"><div class="name"><span class="dot" id="topdot"></span><span id="botname">Pradeep king</span></div><span id="status"></span></div>
<div id="board" role="grid" aria-label="Chess board"></div>
<div class="bar"><div class="name"><span class="dot" id="botdot"></span><span>You</span></div><span id="think"></span></div>
<div class="ctl">
<button id="new">New game</button>
<button id="undo">Undo</button>
<button id="flip">Switch side</button>
</div>
<div id="hist"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const G={P:'♟',N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚'};
let game=new Chess(),human='w',sel=null,targets=[],last=null,busy=false;
const $=id=>document.getElementById(id);
const val={p:100,n:320,b:330,r:500,q:900,k:0};
const pst={p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20]};
function evalW(g){let s=0;const b=g.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const t=pst[p.type];let v=val[p.type];
if(t)v+=p.color==='w'?t[r*8+c]:t[(7-r)*8+c];else if(p.type==='k'){const cen=Math.abs(c-3.5)+Math.abs(r-3.5);v+=(p.color==='w'?(r===7?10:0):(r===0?10:0))}
s+=p.color==='w'?v:-v}return s}
function order(ms){return ms.sort((a,b)=>sc(b)-sc(a))}
function sc(m){let s=0;if(m.captured)s+=10*val[m.captured]-val[m.piece]/10+1000;if(m.promotion)s+=800;return s}
let DL=0;
function ab(g,d,a,b,col){if(Date.now()>DL)throw 0;if(g.in_checkmate())return -99999-d;if(g.in_draw()||g.insufficient_material())return 0;
if(d===0)return col*evalW(g);let best=-Infinity;const ms=order(g.moves({verbose:true}));
for(const m of ms){g.move(m);const v=-ab(g,d-1,-b,-a,-col);g.undo();if(v>best)best=v;if(best>a)a=best;if(a>=b)break}return best}
function pick(){const n0=game.history().length;let list=order(game.moves({verbose:true}));const col=game.turn()==='w'?1:-1;let best=list[0];DL=Date.now()+450;
for(let d=1;d<=6;d++){let bb=null,bv=-Infinity;try{for(const m of list){game.move(m);const v=-ab(game,d-1,-Infinity,Infinity,-col);game.undo();if(v>bv){bv=v;bb=m}}}catch(e){while(game.history().length>n0)game.undo();break}
best=bb;list=[bb].concat(list.filter(x=>x!==bb))}return best}
function render(){const bd=$('board');bd.innerHTML='';const fl=human==='b';
for(let i=0;i<64;i++){const r=fl?7-Math.floor(i/8):Math.floor(i/8),c=fl?7-i%8:i%8;const name='abcdefgh'[c]+(8-r);
const d=document.createElement('div');d.className='sq '+((r+c)%2?'d':'l');d.dataset.sq=name;d.tabIndex=0;
const p=game.get(name);if(p){d.textContent=G[p.type.toUpperCase()];d.classList.add(p.color);d.setAttribute('aria-label',p.color+p.type+' '+name)}
if(last&&(last.from===name||last.to===name))d.classList.add('last');
if(sel===name)d.classList.add('sel');
if(targets.includes(name))d.classList.add(p?'cap':'mv');
d.onclick=()=>tap(name);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(name)}};bd.appendChild(d)}
$('topdot').style.background=human==='w'?'var(--bp)':'var(--wp)';$('botdot').style.background=human==='w'?'var(--wp)':'var(--bp)';
let s='';if(game.in_checkmate())s=(game.turn()===human?'Checkmate — Pradeep king wins':'Checkmate — you win!');
else if(game.in_draw())s='Draw';else if(game.in_check())s='Check';else s=game.turn()===human?'Your move':'';
$('status').textContent=s;
const h=game.history();let t='';for(let i=0;i<h.length;i+=2)t+=(i/2+1)+'. '+h[i]+' '+(h[i+1]||'')+'  ';$('hist').textContent=t;$('hist').scrollTop=1e5}
function tap(sq){if(busy||game.game_over()||game.turn()!==human)return;
if(sel&&targets.includes(sq)){const m=game.move({from:sel,to:sq,promotion:'q'});last=m;sel=null;targets=[];render();botMove();return}
const p=game.get(sq);if(p&&p.color===human){sel=sq;targets=game.moves({square:sq,verbose:true}).map(m=>m.to)}else{sel=null;targets=[]}render()}
let sf=null,sfOK=false,sfCb=null;
try{const url='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
sf=new Worker(URL.createObjectURL(new Blob(["importScripts('"+url+"')"],{type:'application/javascript'})));
sf.onmessage=e=>{const l=typeof e.data==='string'?e.data:'';if(l==='uciok')sf.postMessage('isready');else if(l==='readyok')sfOK=true;else if(l.startsWith('bestmove')&&sfCb){const c=sfCb;sfCb=null;c(l.split(' ')[1])}};
sf.onerror=()=>{sfOK=false};sf.postMessage('uci')}catch(e){sf=null}
function botMove(){if(game.game_over())return;busy=true;$('think').textContent='Pradeep king is thinking…';
const fin=m=>{if(m){game.move(m);last=m}busy=false;$('think').textContent='';render()};
if(sf&&sfOK){let fired=false;const fb=setTimeout(()=>{if(!fired){fired=true;sfCb=null;fin(pick())}},12000);
sfCb=s=>{if(fired)return;fired=true;clearTimeout(fb);const mv=game.move({from:s.slice(0,2),to:s.slice(2,4),promotion:s[4]||'q'});if(mv){last=mv;busy=false;$('think').textContent='';render()}else fin(pick())};
sf.postMessage('position fen '+game.fen());sf.postMessage('go movetime 4500')}
else setTimeout(()=>fin(pick()),100)}
function start(){game=new Chess();sel=null;targets=[];last=null;busy=false;render();if(human==='b')botMove()}
$('new').onclick=start;
$('undo').onclick=()=>{if(busy)return;game.undo();if(game.turn()!==human)game.undo();last=null;sel=null;targets=[];render()};
$('flip').onclick=()=>{human=human==='w'?'b':'w';start()};
start();
</script>
</body>
</html>
